# Packaging for macOS. Signing and notarization credentials are never stored here:
# the signing identity comes from Rachel's login keychain, and notarization reads the
# notarytool keychain profile named in APPLE_KEYCHAIN_PROFILE (see docs/RELEASE.md).
appId: io.github.rachelkph.cherubcourier
productName: Cherub Courier
copyright: Copyright © 2026 Rachel Pham
directories:
  output: out
  buildResources: build
files:
  - package.json
  - dist/**
  - data/sources.json
  # Only the cherub and the fonts (any cat art left on disk stays out of the app).
  - assets/fonts/**
  - assets/cherub/**
  - "!assets/cherub/preview/**"
  - "!assets/cherub/source_manifest.json"
  - "!assets/cherub/source/**" # the picture the newspapers are built from
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
mac:
  category: public.app-category.news
  target:
    - target: dmg
      arch: universal
    # The zip is what the app's updater downloads (Rachel chose automatic updates, 2026-11-12).
    - target: zip
      arch: universal
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  minimumSystemVersion: "12.0"
  artifactName: CherubCourier-${version}-mac.${ext} # the zip; the dmg sets its own name
  icon: build/icon.icns # drawn by scripts/icon.mjs (not in git)
  # Menu-bar app: no Dock icon (Rachel, 2026-11-11).
  extendInfo:
    LSUIElement: true
# Where updates come from: the app reads latest-mac.yml from the newest GitHub release.
# Nothing is uploaded by the build; Rachel attaches the files to the release herself.
publish:
  provider: github
  owner: rachelkph
  repo: cherub-courier
  releaseType: release
dmg:
  sign: true # notarized and stapled by scripts/release.sh
  artifactName: CherubCourier-${version}.dmg
